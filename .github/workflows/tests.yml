# Continuous integration (CI): GitHub runs this on its own machines.
# Every push and pull request gets the Python tests run, and the React page
# type-checked and built, on a fresh computer,
# and the commit shows a green tick (all passed) or a red cross (something failed).

name: Tests

on:
  push:
  pull_request:

# Tests only read the code. A pull request from anyone runs this, so it gets no
# right to change the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest      # a clean Linux machine, new for every run
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip            # reuse downloaded packages between runs

      - name: Install the packages the project needs
        run: pip install -r requirements.txt

      - name: Run the tests
        run: python -m pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: job_finder/frontend
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: job_finder/frontend/package-lock.json

      - name: Install the exact package versions from package-lock.json
        run: npm ci

      - name: Run the page tests
        run: npm test

      - name: Check for mistakes (lint)
        run: npm run lint

      - name: Check types and build the page
        run: npm run build
