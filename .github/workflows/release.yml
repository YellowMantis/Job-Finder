# Continuous delivery (CD): when you push a version tag, GitHub builds the
# desktop app on Windows, macOS and Linux machines at the same time and
# publishes them together as one Release.
#
#   1. raise VERSION in job_finder/version.py and commit
#   2. git tag v1.2.3   (the same number)
#   3. git push origin v1.2.3

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # needed to create the Release

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            file: job_finder/build/Job-Finder-Setup.exe
          - os: macos-latest
            file: job_finder/build/Job-Finder-mac.dmg
          - os: ubuntu-latest
            file: job_finder/build/Job-Finder-linux.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Get the code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: job_finder/frontend/package-lock.json

      - name: Check the tag matches the version in the code
        shell: bash
        run: |
          VERSION=$(python -c "import sys; sys.path.insert(0, 'job_finder'); from version import VERSION; print(VERSION)")
          if [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "The tag ${GITHUB_REF_NAME} doesn't match version.py (${VERSION})."; exit 1
          fi

      - name: Install the packages
        run: pip install -r requirements.txt

      - name: On Linux, the window needs Qt (the other systems have a built-in web view)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1
          pip install "pywebview[qt]==6.2.1"   # the same version as requirements.txt

      - name: On Windows, make sure Inno Setup is there for the installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }

      - name: Run the tests first (a release is never built from failing code)
        run: python -m pytest -q

      - name: Build the app
        run: python job_finder/tools/build_desktop.py

      - name: Keep the result for the release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: ${{ runner.os }}
          path: ${{ matrix.file }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Collect the three builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: builds
          merge-multiple: true

      - name: Publish the Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          files: builds/*
          generate_release_notes: true
          body: |
            **Windows:** download `Job-Finder-Setup.exe` and run it.
            **macOS (beta):** open `Job-Finder-mac.dmg` and drag Job Finder into Applications; the first time, right-click it and choose Open.
            **Linux (beta):** unpack `Job-Finder-linux.tar.gz` and run `Job Finder` inside.
